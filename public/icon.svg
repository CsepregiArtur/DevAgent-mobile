<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>

  <!-- Glowing subtle badge -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Code / Terminal / Agent Glyph -->
  <!-- Terminal window outline -->
  <rect x="96" y="116" width="320" height="280" rx="36" fill="#090d16" stroke="url(#brand)" stroke-width="10"/>

  <!-- Window dots -->
  <circle cx="140" cy="156" r="10" fill="#ef4444" />
  <circle cx="170" cy="156" r="10" fill="#f59e0b" />
  <circle cx="200" cy="156" r="10" fill="#10b981" />

  <!-- Code brackets & Prompt prompt -->
  <path d="M 160 220 L 220 270 L 160 320" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="250" y1="320" x2="340" y2="320" stroke="#a855f7" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Agent spark -->
  <path d="M 340 190 Q 360 210 380 210 Q 360 210 340 230 Q 340 210 320 210 Q 340 210 340 190 Z" fill="#ec4899"/>
</svg>
